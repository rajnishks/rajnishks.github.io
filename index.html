<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soccer Track</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    button { font-family: inherit; }

    #launch {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background:
        radial-gradient(circle at 50% 20%, #ffffff 0%, transparent 42%),
        linear-gradient(180deg, #d7f3ff 0%, #8ecdf2 100%);
    }
    #launch h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 72px);
      letter-spacing: 0.04em;
      color: #14324a;
    }
    #launch p {
      margin: -12px 0 8px;
      color: #24516e;
      font-size: 18px;
    }
    #launch-btn {
      background: #ff4fa3;
      color: white;
      border: none;
      border-radius: 28px;
      padding: 28px 78px;
      font-size: 64px;
      font-weight: 800;
      letter-spacing: 0.14em;
      cursor: pointer;
      box-shadow: 0 12px 0 #c2186b, 0 18px 30px rgba(194, 24, 107, 0.35);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    #launch-btn:hover { transform: translateY(-2px); }
    #launch-btn:active {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #c2186b, 0 8px 16px rgba(194, 24, 107, 0.35);
    }

    #touch {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      padding: 0 18px;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }
    #touch.on { display: flex; }
    #touch button {
      pointer-events: auto;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 79, 163, 0.55);
      color: white;
      font-size: 30px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }
    #touch button.jump { width: 104px; height: 104px; font-size: 18px; letter-spacing: 0.06em; }
    #touch button:active { background: rgba(255, 79, 163, 0.9); }
    @media (max-width: 600px) {
      #launch-btn {
        font-size: 40px;
        padding: 20px 44px;
        letter-spacing: 0.08em;
      }
      #launch h1 { font-size: 40px; }
      #hud { font-size: 22px; }
      .card { min-width: 0; width: 86vw; padding: 24px; }
    }

    #game {
      display: none;
      height: 100%;
      position: relative;
      background: #050816;
      overflow: hidden;
    }
    #game.active { display: block; }
    canvas, #game, body {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #050816;
    }
    #hud, #help {
      position: absolute;
      left: 20px;
      color: #eaf6ff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    #hud {
      top: 16px;
      font-size: 28px;
      font-weight: 800;
    }
    #help {
      top: 52px;
      font-size: 16px;
    }
    #overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10, 40, 64, 0.45);
      align-items: center;
      justify-content: center;
    }
    #overlay.show { display: flex; }
    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 40px;
      text-align: center;
      min-width: 280px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
    }
    .card h2 { margin: 0 0 8px; color: #14324a; }
    .card p { margin: 0 0 20px; color: #35596f; }
    .card button {
      background: #ff4fa3;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 6px 0 #c2186b;
    }
    .card button:active { transform: translateY(3px); box-shadow: 0 3px 0 #c2186b; }
  </style>
</head>
<body>
  <section id="launch">
    <h1>Soccer Track</h1>
    <p>Jump the barriers. Reach the finish.</p>
    <button id="launch-btn" type="button">LAUNCH</button>
  </section>

  <section id="game">
    <canvas id="c"></canvas>
    <div id="hud">Level <span id="level-label">1</span></div>
    <div id="help">Arrow keys move · Space jumps</div>
    <div id="touch">
      <button type="button" data-k="left" aria-label="Move left">◀</button>
      <button type="button" class="jump" data-k="jump" aria-label="Jump">JUMP</button>
      <button type="button" data-k="right" aria-label="Move right">▶</button>
    </div>
    <div id="overlay">
      <div class="card">
        <h2 id="overlay-title">Level complete</h2>
        <p id="overlay-text"></p>
        <button id="overlay-btn" type="button">Next level</button>
      </div>
    </div>
  </section>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const launchEl = document.getElementById("launch");
    const gameEl = document.getElementById("game");
    const levelLabel = document.getElementById("level-label");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayText = document.getElementById("overlay-text");
    const overlayBtn = document.getElementById("overlay-btn");

    const BALL_R = 18;
    const GRAVITY = 0.42;
    const JUMP_V = -11.6;
    const MAX_RUN = 6.3;
    const ACCEL = 0.85;

    const keys = { left: false, right: false };
    let jumpEdge = false;
    let jumpHeld = false;
    let viewW = 0;
    let viewH = 0;
    let level = 1;
    let mode = "menu";
    let platforms = [];
    let obstacles = [];
    let solids = [];
    let finishX = 0;
    let camX = 0;
    let camY = 0;
    let ball = null;
    let stars = [];

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      viewW = window.innerWidth;
      viewH = window.innerHeight;
      canvas.width = Math.floor(viewW * dpr);
      canvas.height = Math.floor(viewH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function makeStars() {
      stars = [];
      for (let layer = 0; layer < 3; layer++) {
        const count = 110 - layer * 25;
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * viewW,
            y: Math.random(),
            r: (0.5 + Math.random() * 1.1) * (layer === 2 ? 1.7 : 1),
            layer,
            phase: Math.random() * Math.PI * 2,
            speed: 0.5 + Math.random() * 2
          });
        }
      }
    }

    function drawSpace(t) {
      const g = ctx.createLinearGradient(0, 0, 0, viewH);
      g.addColorStop(0, "#050816");
      g.addColorStop(0.6, "#0b1533");
      g.addColorStop(1, "#1d1247");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, viewW, viewH);

      const neb = ctx.createRadialGradient(viewW * 0.75, viewH * 0.3, 10, viewW * 0.75, viewH * 0.3, viewW * 0.45);
      neb.addColorStop(0, "rgba(140, 90, 255, 0.20)");
      neb.addColorStop(1, "rgba(140, 90, 255, 0)");
      ctx.fillStyle = neb;
      ctx.fillRect(0, 0, viewW, viewH);

      const parallax = [0.06, 0.16, 0.32];
      for (const s of stars) {
        const x = (((s.x - camX * parallax[s.layer]) % viewW) + viewW) % viewW;
        const y = s.y * viewH * 0.95;
        const tw = 0.55 + 0.45 * Math.sin(t * 0.002 * s.speed + s.phase);
        ctx.globalAlpha = tw * (0.5 + s.layer * 0.25);
        ctx.fillStyle = s.layer === 2 ? "#fff8e1" : "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      const px = viewW - 130;
      const py = 96;
      const pg = ctx.createRadialGradient(px - 14, py - 14, 6, px, py, 46);
      pg.addColorStop(0, "#ffb3d9");
      pg.addColorStop(1, "#7a2fb5");
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(px, py, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 220, 240, 0.55)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(px, py, 66, 14, -0.25, 0, Math.PI * 2);
      ctx.stroke();
    }

    function generateLevel(n) {
      const gapChance = Math.min(0.12 + (n - 1) * 0.07, 0.62);
      const maxGap = Math.min(70 + n * 16, 190);
      const maxObs = Math.min(34 + n * 12, 112);
      const obsChance = Math.min(0.45 + (n - 1) * 0.08, 0.92);
      const vert = Math.min(16 + n * 12, 100);
      const segs = 5 + n * 2;

      platforms = [];
      obstacles = [];
      let x = 0;
      let y = 500;
      const startW = 460;
      platforms.push({ x, y, w: startW });
      x += startW;

      for (let i = 0; i < segs; i++) {
        if (Math.random() < gapChance) {
          x += 56 + Math.random() * maxGap;
        }
        const w = Math.max(168, 300 - n * 6 + Math.random() * 180);
        y = clamp(y + (Math.random() * 2 - 1) * vert, 280, 540);
        platforms.push({ x, y, w });

        const room = w - 150;
        if (room > 40 && Math.random() < obsChance) {
          const count = n >= 4 && room > 180 && Math.random() < 0.5 ? 2 : 1;
          let cursor = x + 78;
          for (let k = 0; k < count; k++) {
            const ow = 32 + Math.random() * 18;
            const oh = 32 + Math.random() * maxObs;
            const span = x + w - 70 - ow - cursor;
            if (span < 10) break;
            const ox = cursor + Math.random() * span * (count === 1 ? 1 : 0.55);
            obstacles.push({ x: ox, y: y - oh, w: ow, h: oh });
            cursor = ox + ow + 90;
          }
        }
        x += w;
      }

      x += 36 + Math.min(40 + n * 8, 100);
      const finishW = 340;
      const finishY = clamp(y + (Math.random() * 40 - 20), 360, 520);
      platforms.push({ x, y: finishY, w: finishW, finish: true });
      finishX = x + finishW - 90;

      solids = [];
      for (const p of platforms) {
        solids.push({ x: p.x, y: p.y, w: p.w, h: 5000, climb: true });
      }
      for (const o of obstacles) {
        solids.push({ x: o.x, y: o.y, w: o.w, h: o.h, climb: false });
      }

      const ground = platforms[0].y;
      ball = {
        x: 130,
        y: ground - BALL_R,
        vx: 0,
        vy: 0,
        prevX: 130,
        prevY: ground - BALL_R,
        rot: 0,
        onGround: true,
        coyote: 0,
        jumpBuf: 0
      };
      camX = 0;
      camY = ground - viewH * 0.62;
      levelLabel.textContent = String(n);
    }

    function circleHitsRect(cx, cy, r, rect) {
      const nx = clamp(cx, rect.x, rect.x + rect.w);
      const ny = clamp(cy, rect.y, rect.y + rect.h);
      const dx = cx - nx;
      const dy = cy - ny;
      return { hit: dx * dx + dy * dy < r * r, nx, ny, dx, dy };
    }

    function resolveSolid(b, rect) {
      const hit = circleHitsRect(b.x, b.y, BALL_R, rect);
      if (!hit.hit) return;

      const cameFromAbove = b.prevY + BALL_R <= rect.y + 3 && b.vy >= 0;
      const insideX = b.x > rect.x && b.x < rect.x + rect.w;
      const insideY = b.y > rect.y && b.y < rect.y + rect.h;
      const intoTop = b.y + BALL_R - rect.y;

      if (rect.climb && intoTop >= -0.5 && intoTop <= 64 && b.vy >= 0) {
        b.y = rect.y - BALL_R;
        b.vy = 0;
        b.onGround = true;
        return;
      }

      if (cameFromAbove && (insideX || hit.ny <= rect.y + 0.5)) {
        b.y = rect.y - BALL_R;
        b.vy = 0;
        b.onGround = true;
        return;
      }

      if (insideX && insideY) {
        const toLeft = b.prevX < rect.x + rect.w / 2;
        b.x = toLeft ? rect.x - BALL_R : rect.x + rect.w + BALL_R;
        b.vx = 0;
        return;
      }

      const dist = Math.hypot(hit.dx, hit.dy) || 0.0001;
      const overlap = BALL_R - dist;
      const absX = Math.abs(hit.dx);
      const absY = Math.abs(hit.dy);

      if (absY >= absX && hit.dy < 0 && b.vy >= 0) {
        b.y -= overlap * (hit.dy / dist);
        b.y = Math.min(b.y, rect.y - BALL_R);
        b.vy = 0;
        b.onGround = true;
      } else if (absY > absX && hit.dy > 0) {
        b.y += overlap * (hit.dy / dist);
        b.vy = Math.max(0, b.vy);
      } else {
        b.x += overlap * (hit.dx / dist);
        b.vx = 0;
      }
    }

    function step() {
      if (mode !== "play") return;

      ball.prevX = ball.x;
      ball.prevY = ball.y;

      if (keys.right) ball.vx = Math.min(MAX_RUN, ball.vx + ACCEL);
      else if (keys.left) ball.vx = Math.max(-MAX_RUN, ball.vx - ACCEL);
      else ball.vx *= 0.8;

      if (Math.abs(ball.vx) < 0.08) ball.vx = 0;
      ball.vy += GRAVITY;
      if (!jumpHeld && ball.vy < -3.4) ball.vy = -3.4;

      if (ball.onGround) ball.coyote = 8;
      else if (ball.coyote > 0) ball.coyote--;
      if (jumpEdge) {
        ball.jumpBuf = 8;
        jumpEdge = false;
      }
      if (ball.jumpBuf > 0 && ball.coyote > 0) {
        ball.vy = JUMP_V;
        ball.onGround = false;
        ball.coyote = 0;
        ball.jumpBuf = 0;
      } else if (ball.jumpBuf > 0) {
        ball.jumpBuf--;
      }

      ball.x += ball.vx;
      ball.y += ball.vy;
      ball.rot += ball.vx * 0.045;
      ball.onGround = false;

      for (let pass = 0; pass < 3; pass++) {
        for (const solid of solids) resolveSolid(ball, solid);
      }

      if (ball.x < BALL_R) {
        ball.x = BALL_R;
        ball.vx = 0;
      }

      const look = viewW * 0.34;
      const targetX = ball.x - look;
      const targetY = ball.y - viewH * 0.58;
      camX += (targetX - camX) * 0.12;
      camY += (targetY - camY) * 0.1;
      if (camX < 0) camX = 0;

      if (ball.y - BALL_R > 820) {
        showOverlay("Off the track", "The ball fell through a gap.", "Try again", () => startLevel(level));
      } else if (ball.x >= finishX) {
        const done = level;
        showOverlay("Level " + done + " complete", "The next track is longer and trickier.", "Next level", () => startLevel(done + 1));
      }
    }

    function drawCloud(x, y, s) {
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.beginPath();
      ctx.ellipse(x, y, 36 * s, 18 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 28 * s, y + 4 * s, 26 * s, 16 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x - 26 * s, y + 6 * s, 22 * s, 14 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBall(b) {
      const dir = b.vx < -0.3 ? -1 : 1;
      const flame = keys.right || keys.left || !b.onGround;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(dir, 1);

      if (flame) {
        const len = 14 + Math.random() * 8;
        const fg = ctx.createLinearGradient(-BALL_R, 0, -BALL_R - len, 0);
        fg.addColorStop(0, "rgba(255, 220, 120, 0.95)");
        fg.addColorStop(1, "rgba(255, 90, 40, 0)");
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(-BALL_R + 4, -5);
        ctx.lineTo(-BALL_R - len, 0);
        ctx.lineTo(-BALL_R + 4, 5);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = "#c9d6e3";
      ctx.beginPath();
      ctx.moveTo(BALL_R + 4, 0);
      ctx.lineTo(-BALL_R * 0.6, -BALL_R * 0.85);
      ctx.lineTo(-BALL_R * 0.6, BALL_R * 0.85);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#2c3e50";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#ff4fa3";
      ctx.beginPath();
      ctx.moveTo(-BALL_R * 0.6, -BALL_R * 0.85);
      ctx.lineTo(-BALL_R * 1.1, -BALL_R * 1.1);
      ctx.lineTo(-BALL_R * 0.2, -BALL_R * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-BALL_R * 0.6, BALL_R * 0.85);
      ctx.lineTo(-BALL_R * 1.1, BALL_R * 1.1);
      ctx.lineTo(-BALL_R * 0.2, BALL_R * 0.3);
      ctx.closePath();
      ctx.fill();

      const cg = ctx.createRadialGradient(4, -2, 1, 4, 0, 8);
      cg.addColorStop(0, "#e0faff");
      cg.addColorStop(1, "#2a9fd6");
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(4, 0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function pentagon(x, y, r) {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      if (!ball) return;
      ctx.clearRect(0, 0, viewW, viewH);
      drawSpace(performance.now());

      ctx.save();
      ctx.translate(-camX, -camY);

      for (const p of platforms) {
        const beamH = 46;
        const fade = ctx.createLinearGradient(0, p.y, 0, p.y + beamH);
        fade.addColorStop(0, "rgba(120, 240, 255, 0.55)");
        fade.addColorStop(0.5, "rgba(80, 180, 255, 0.18)");
        fade.addColorStop(1, "rgba(80, 180, 255, 0)");
        ctx.fillStyle = fade;
        ctx.fillRect(p.x, p.y, p.w, beamH);

        ctx.save();
        ctx.shadowColor = "rgba(100, 230, 255, 1)";
        ctx.shadowBlur = 28;
        ctx.fillStyle = "#e9fdff";
        ctx.fillRect(p.x, p.y - 2, p.w, 5);
        ctx.restore();

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(p.x, p.y - 1, p.w, 2);
      }

      for (const o of obstacles) {
        const r = o.w / 2;
        const cx = o.x + r;
        const cy = o.y + o.h - r;
        const hue = (Math.round(o.x) * 37) % 360;
        const pg = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
        pg.addColorStop(0, `hsl(${hue}, 85%, 75%)`);
        pg.addColorStop(0.7, `hsl(${hue}, 60%, 42%)`);
        pg.addColorStop(1, `hsl(${hue}, 60%, 22%)`);
        ctx.save();
        ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.8)`;
        ctx.shadowBlur = 14;
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = `hsla(${hue}, 80%, 85%, 0.8)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, r * 1.35, r * 0.3, -0.25, 0, Math.PI * 2);
        ctx.stroke();
      }

      const poleY = platforms[platforms.length - 1].y;
      ctx.fillStyle = "#222";
      ctx.fillRect(finishX, poleY - 92, 8, 92);
      const cells = 4;
      const cell = 10;
      for (let row = 0; row < cells; row++) {
        for (let col = 0; col < cells; col++) {
          ctx.fillStyle = (row + col) % 2 === 0 ? "#111" : "#fff";
          ctx.fillRect(finishX + 8 + col * cell, poleY - 92 + row * cell, cell, cell);
        }
      }

      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.beginPath();
      ctx.ellipse(ball.x, ball.y + BALL_R - 2, BALL_R * 0.8, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      drawBall(ball);

      ctx.restore();
    }

    function loop() {
      step();
      draw();
      requestAnimationFrame(loop);
    }

    function showOverlay(title, text, button, action) {
      mode = "paused";
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlayBtn.textContent = button;
      overlayBtn.onclick = action;
      overlay.classList.add("show");
    }

    function hideOverlay() {
      overlay.classList.remove("show");
      overlayBtn.onclick = null;
    }

    function startLevel(n) {
      level = n;
      hideOverlay();
      generateLevel(n);
      mode = "play";
    }

    document.getElementById("launch-btn").addEventListener("click", () => {
      launchEl.style.display = "none";
      gameEl.classList.add("active");
      resize();
      makeStars();
      startLevel(1);
    });

    window.addEventListener("resize", resize);

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Space") {
        e.preventDefault();
      }
      if (e.code === "ArrowLeft") keys.left = true;
      if (e.code === "ArrowRight") keys.right = true;
      if (e.code === "Space" && !e.repeat) {
        jumpEdge = true;
        jumpHeld = true;
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft") keys.left = false;
      if (e.code === "ArrowRight") keys.right = false;
      if (e.code === "Space") jumpHeld = false;
    });

    const touchEl = document.getElementById("touch");
    const isTouch = window.matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
    if (isTouch) {
      touchEl.classList.add("on");
      document.getElementById("help").style.display = "none";
    }

    touchEl.querySelectorAll("button").forEach((btn) => {
      const k = btn.dataset.k;
      const press = (e) => {
        e.preventDefault();
        try {
          btn.setPointerCapture(e.pointerId);
        } catch (_) {}
        if (k === "left") keys.left = true;
        else if (k === "right") keys.right = true;
        else {
          jumpEdge = true;
          jumpHeld = true;
        }
      };
      const release = () => {
        if (k === "left") keys.left = false;
        else if (k === "right") keys.right = false;
        else jumpHeld = false;
      };
      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("lostpointercapture", release);
    });

    window.addEventListener("blur", () => {
      keys.left = false;
      keys.right = false;
      jumpHeld = false;
    });

    resize();
    requestAnimationFrame(loop);

  </script>
</body>
</html>
